general:
  language: en
  cache_dir: cache
  output_dir: output
  ffmpeg_path: ''
  ffprobe_path: ''
whisper:
  model: small
  device: auto
  compute_type: auto
  beam_size: 5
  vad_filter: true
  vad_min_silence_ms: 500
  word_timestamps: true
  condition_on_previous_text: false
  cpu_threads: 0
llm:
  backend: ollama
  model: qwen2.5:7b-instruct
  base_url: http://127.0.0.1:11434
  api_key: ''
  temperature: 0.25
  top_p: 0.9
  num_ctx: 8192
  max_tokens: 3072
  request_timeout: 600
  keep_alive: 10m
  unload_after_analysis: true
  use_json_schema: true
  max_retries: 3
clips:
  min_duration: 20
  max_duration: 90
  target_count: 10
  ideal_duration: 45
  block_seconds: 420
  block_overlap_seconds: 45
  max_blocks: 0
  max_candidates_pass1: 60
  boundary_optimization: true
  boundary_candidates: 20
  boundary_context_sentences: 5
  overlap_iou_threshold: 0.4
  final_pool_size: 18
  diversity_lambda: 0.7
  min_gap_between_clips: 5
scoring:
  weights:
    hook: 25.0
    payoff: 25.0
    emotion: 15.0
    curiosity: 15.0
    standalone: 10.0
    editability: 10.0
  heuristic_blend: 0.15
export:
  mode: copy
  reencode_crf: 20
  reencode_preset: veryfast
  padding_start: 0.15
  padding_end: 0.35
  encoder: auto
captions:
  enabled: true
  font: Arial Rounded MT Bold
  fonts_dir: assets/fonts
  font_size_ratio: 0.07
  base_color: '#ffffff'
  highlight_color: '#44c520'
  outline_color: '#000000'
  highlight_outline_color: ''
  outline_ratio: 0.09
  shadow_ratio: 0.05
  position: bottom
  margin_v_ratio: 0.16
  max_words: 4
  max_chars: 0
  max_duration: 2.4
  uppercase: false
  strip_punctuation: true
  highlight_scale: 118
  animation_ms: 130
  fade_ms: 90
  time_offset: -0.05
  lead_in_max: 0.12
  tail_hold: 0.1
server:
  host: 127.0.0.1
  port: 8420
  open_browser: true
